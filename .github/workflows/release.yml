name: Build installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.1)"
        required: true
        default: "1.0.0"
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then V="${GITHUB_REF_NAME#v}"; else V="${{ inputs.version }}"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Build app
        run: UNIVERSAL=1 ./scripts/build-app.sh

      - name: Build DMG
        run: ./scripts/make-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeUsageBar-dmg
          path: build/ClaudeUsageBar.dmg

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" build/ClaudeUsageBar.dmg \
            --target "$GITHUB_SHA" \
            --title "Claude Usage Bar v$VERSION" \
            --notes "Download **ClaudeUsageBar.dmg**, open it, and drag the app into Applications. See the README for the first-launch steps."
